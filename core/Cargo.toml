[package]
name = "inkstone-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mdxjs = "=1.0.4"
markdown = "1"
serde = "=1.0.219"
serde_json = "=1.0.140"
rustc-hash = "2"
swc_core = { version = "27", features = ["common", "ecma_ast", "ecma_codegen"] }
wasm-bindgen = "=0.2.105"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
