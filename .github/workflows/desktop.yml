name: Desktop
on: [push, pull_request]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Chinese system font fallback (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk ibus-libpinyin ibus-gtk3 dbus-x11 xdotool
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          cache-on-failure: true
      - run: cargo install wasm-bindgen-cli --version 0.2.105 --locked
      - run: npm ci
      - run: npm run build:core
      - run: cargo test --manifest-path core/Cargo.toml --locked
      - run: npm ci --prefix examples/project --ignore-scripts
      - run: npm run build
      - name: Electron interaction (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
      - name: Electron interaction (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - run: npm run desktop:dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Packaged application interaction (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/check-package.mjs
      - name: Packaged application interaction (Windows and macOS)
        if: runner.os != 'Linux'
        run: node scripts/check-package.mjs
      - name: Real Linux system IME
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a bash scripts/test-system-ime.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ runner.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            release/*.zip
            docs/desktop-*.png
            desktop-test-results/
